import { Calculator } from '../js/engine.js';

// 表示を文字列化：例 "E 2'015.6250 [03=]"
export function text(D) {
  let s = '';
  let started = false;
  for (const c of D.cells) {
    if (!started && !c.ch) continue;
    started = true;
    s += c.ch || ' ';
    if (c.comma) s += "'";
    if (c.dp) s += '.';
  }
  return (D.minus ? '-' : '') + s;
}

const KEYS = new Set(['+','-','*','/','=','%','SQRT','PM','SHIFT','CE','C','CA','CM','RM','M+','M-','GT','DT','00']);
function run(calc, seq) {
  for (const tok of seq.trim().split(/\s+/)) {
    if (KEYS.has(tok)) calc.press(tok);
    else for (const ch of tok) calc.press(ch);
  }
}

  ['p28 手形割引', { round: 'up', tab: '0' }, [
    ['C DT 2 DT 6 %', '2  6', {}],
    ['4 DT 26 =', '80', { hi: true }],

    ['2 DT', "2-00'--.", { jikan: true, ctr: '01' }],
    ['30 + 1 DT =', "3-30'00.", {}],

    ['0 =', "5-15'00.", {}],
  ]],
  ['実機確認：10進表示のTAB・カウンター・＝後の日数/時間', { tab: '2' }, [
    ['C DT DT 1 DT 20 + 0 =', "1-20'00.", {}],
    ['DT', '1.33', {}],
    ['DT', "1-20'00.", {}],
    ['C 1 + ' + '= '.repeat(99), '99.00', { ctr: '99' }],
    ['=', '100.00', { ctr: '00' }],
    ['C 5 + 3 = DT', '0.', { jikan: true }],

  ['オートパワーオフ', {}, [
    ['C 5', '5.', {}],
    ['@off 7', '', {}],
    ['C', '0.', {}],

let pass = 0, fail = 0;
const out = [];
for (const [name, sw, steps] of T) {
  const c = new Calculator();
  Object.assign(c.sw, sw);
  let ok = true;
  const log = [];
  for (const [keys, exp, flags] of steps) {
    let k = keys;
    const m = k.match(/^@round=(\w+)\s*/);
    if (m) { c.sw.round = m[1]; k = k.slice(m[0].length); }
    if (k.startsWith('@off')) { c.powerOff(); k = k.slice(4); }
    run(c, k);
    const D = c.getDisplay();
    const got = text(D);
    const probs = [];
    if (got !== exp) probs.push(`表示 "${got}" ≠ "${exp}"`);
    for (const [f, v] of Object.entries(flags)) {
      const actual = f === 'ctr' ? D.counter : D[f];
      if ((actual ?? null) !== v) probs.push(`${f}=${JSON.stringify(actual)} ≠ ${JSON.stringify(v)}`);
    }
    if (probs.length) { ok = false; log.push(`   ✗ [${keys}] ${probs.join(', ')}`); }
  }
  if (ok) pass++; else fail++;
  out.push(`<span class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${name}</span>` + (log.length ? '\n' + log.join('\n') : ''));
}
document.getElementById('summary').innerHTML = `<b class="${fail ? 'fail' : 'pass'}">${pass} passed, ${fail} failed</b>`;
document.getElementById('out').innerHTML = out.join('\n');
window.__results = { pass, fail };
</script>
</body>
</html>
